[server]
addr = "0.0.0.0:3000"
reload_config_interval = 60  # Reload config every 60 seconds (0 to disable)
base_path = "/uptime-forge"  # Run behind reverse proxy at subpath

[endpoints.mozart409]
addr = "https://mozart409.com/"
description = "mozart409.com"
group = "external"
tags = ["external"]

[endpoints.homeassistant]
addr = "https://homeassistant.dropbear-butterfly.ts.net"
description = "Home Assistant"
group = "internal"
tags = ["internal", "smarthome"]

[endpoints.hofvarpnir]
# A health endpoint, NOT the root. The root returns 200 from the login redirect
# even when the app is broken: on 2026-08-13 the download supervisor actor
# panicked and every queued download stopped for 20h43m while this check stayed
# green the whole time.
#
# Of the three the app exposes, /api/health is the one to use -- it is the
# "comprehensive" check (database AND yt-dlp status, 503 when unhealthy) and its
# own OpenAPI description says it is meant for monitoring. /api/health/ready is
# narrower (database connection only) and /api/health/live is a pure liveness
# probe that deliberately checks no dependencies -- picking that one would
# recreate the exact blind spot described above.
addr = "https://hofvarpnir.homelab.internal/api/health"
description = "Hofvarpnir"
group = "internal"
tags = ["internal", "media"]
# step-ca cert; uptime-forge (rustls/webpki-roots) does not trust step-ca.
skip_tls_verification = true

[endpoints.jellyfin]
addr = "https://jellyfin.homelab.internal"
description = "Jellyfin Media Server"
group = "internal"
tags = ["internal", "media"]
# step-ca cert; uptime-forge (rustls/webpki-roots) does not trust step-ca.
skip_tls_verification = true

[endpoints.pve-gigabyte]
addr = "https://pve-gigabyte.dropbear-butterfly.ts.net"
description = "PVE Gigabyte"
group = "internal"
tags = ["internal", "infrastructure"]

[endpoints.homelab-unifi]
# Kept on the ts.net name. Moving this to unifi.homelab.internal was tried on
# 2026-08-15 and reverted: the host is up (node_exporter scrapes fine), 443 is
# open and caddy is running with a vhost listing both names, but it aborts the
# TLS handshake for the .internal SNI -- "error sending request", no status code.
# skip_tls_verification does NOT rescue that: it skips validating a presented
# cert, and here caddy presents none for that name. Restarting caddy did not fix
# it. Same gap as forgejo (see hosts/otel/blackbox.nix). Switch this once the
# .internal cert actually issues on the unifi host.
addr = "https://homelab-unifi.dropbear-butterfly.ts.net"
description = "UniFi Controller"
group = "internal"
tags = ["internal", "infrastructure"]

# Example: Your own services
# [endpoints.my-api]
# addr = "https://api.example.com/health"
# description = "My API Service"
# group = "backend"
# tags = ["api", "critical"]
# interval = 30
# timeout = 10
# expected_status = 200

# Example: Service with authentication
# [endpoints.private-api]
# addr = "https://api.example.com/private/health"
# description = "Private API"
# group = "backend"
# headers = { Authorization = "Bearer ${API_TOKEN}" }

# Example: POST request with body
# [endpoints.webhook-check]
# addr = "https://api.example.com/webhook"
# method = "POST"
# body = '{"check": "health"}'
# headers = { "Content-Type" = "application/json" }

# Example: TCP check (database, redis, etc.)
# [endpoints.database]
# addr = "tcp://db.example.com:5432"
# type = "tcp"
# description = "PostgreSQL Database"
# group = "infrastructure"

# Example: DNS check
# [endpoints.dns-check]
# addr = "dns://example.com"
# type = "dns"
# description = "DNS Resolution"
# expected_records = ["1.2.3.4"]

# All available options:
# addr = "https://example.com"        # Required: URL to check
# type = "http"                       # Check type: "http" (default), "tcp", "dns"
# description = "My Service"          # Optional description
# group = "backend"                   # Optional group for organizing endpoints
# tags = ["production", "critical"]   # Optional tags for filtering
# interval = 60                       # Check interval in seconds (default: 60)
# timeout = 10                        # Request timeout in seconds (default: 10)
# expected_status = 200               # Expected HTTP status (default: 200)
# skip_tls_verification = false       # Skip TLS cert verification (default: false)
# method = "GET"                      # HTTP method: GET, POST, PUT, etc. (default: GET)
# headers = { Key = "Value" }         # Custom headers (supports ${ENV_VAR} syntax)
# body = '{"key": "value"}'           # Request body for POST/PUT
# retries = 0                         # Number of retries before marking as failed (default: 0)
# retry_delay = 5                     # Delay between retries in seconds (default: 5)
# alert_after_failures = 3            # Alert after N consecutive failures (default: 3)
# alert_channels = ["webhook"]        # Alert channels to notify
