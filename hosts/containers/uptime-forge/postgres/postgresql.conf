listen_addresses = '*'
shared_preload_libraries = 'timescaledb,pg_stat_statements'

# ── Sizing ────────────────────────────────────────────────────────────────────
# containers = 4 vCPU / 3.3 GiB RAM, shared with axon-gateway, romm, albyhub,
# open-webui. The DB is ~150 MB and reads at a 99.99% buffer hit rate, so this
# is deliberately NOT a "shared_buffers = 25% of RAM" tuning — the working set
# already fits and the host has no memory to spare.
max_connections = 30
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 256MB
autovacuum_work_mem = 64MB
effective_cache_size = 1GB

# ── Planner ───────────────────────────────────────────────────────────────────
# Backing store is the 2-HDD zfs_pool fronted by ARC: random reads are cheaper
# than bare spindles but nowhere near SSD, and prefetch depth stays shallow.
random_page_cost = 2.5
effective_io_concurrency = 2
jit = off

# ── Write path ────────────────────────────────────────────────────────────────
# Uptime samples are append-only and disposable. Trading <1s of on-crash
# durability for the WAL fsync that dominates INSERT latency on spinning rust.
synchronous_commit = off
wal_compression = on
wal_buffers = 16MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
max_wal_size = 1GB
min_wal_size = 256MB

# ── Workers ───────────────────────────────────────────────────────────────────
# TimescaleDB requires
#   max_worker_processes >= max_background_workers + max_parallel_workers + 1
# The stock combo (16 background workers vs. 8 worker processes) violates this.
timescaledb.max_background_workers = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_worker_processes = 16

# ── Observability ─────────────────────────────────────────────────────────────
timescaledb.telemetry_level = off
track_io_timing = on

# pg_stat_statements settings
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = on
pg_stat_statements.save = on
