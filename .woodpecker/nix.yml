# NixOS config check. Evaluates + dry-runs the toplevel build for the hosts a
# push actually touched, pulling from the homelab attic cache. This is the
# AGENTS.md §7 scoped gate: full `nix flake check` evaluates all ~16 hosts and
# gets OOM-killed (exit 137) on the nix-daemon.
#
# Every nix command here uses the attic cache via NIX_CONFIG (substituters).
# The agent's WOODPECKER_BACKEND_DOCKER_VOLUMES mounts the host step-ca bundle
# at /etc/ssl/certs/ca-certificates.crt, which NIX_SSL_CERT_FILE points at so
# cache.homelab.local TLS is trusted inside the step container.
#
# Note: this checks nixosConfigurations (mkHost), which omits the
# home-manager/nixvim layer. The only gate that exercises that layer is
# `just colmena-build` -- which CI deliberately does NOT run (it builds every
# node and is the human pre-deploy gate, AGENTS.md §3).
when:
  - event: [push, pull_request]
    path:
      include:
        - flake.nix
        - flake.lock
        - hosts/**
        - modules/**
        - secrets/**
        - justfile
        - .woodpecker/nix.yml

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false

steps:
  - name: nix-check
    # Pinned nix version (not `latest`) so the flake-parser behavior in CI is
    # reproducible. The image ships gitMinimal + openssh.
    image: nixos/nix:2.35.2
    pull: true
    environment:
      HOME: /root
      # Attic cache + cache.nixos.org. Root inside the step container, so the
      # substituters are trusted without a nix.conf override.
      NIX_CONFIG: |-
        substituters = https://cache.homelab.local/homelab https://cache.nixos.org/
        trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= homelab:aswnRAo2zbP13gGnUTCINX78X/lURQgPAfrgNpHpQpY=
        connect-timeout = 5
        fallback = true
        # The step container has no nix-daemon, so the nix-command/flakes
        # experimental features must be enabled explicitly for `nix build`.
        experimental-features = nix-command flakes
      # The agent bind-mounts the host CA bundle over this path, so step-ca
      # certs (cache.homelab.local, forgejo.homelab.local) are trusted. The
      # homelab-mcp flake input is fetched over git+https (public repo), which
      # nix's libgit2 needs GIT_SSL_CAINFO to trust.
      NIX_SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt
    commands:
      - |
        set -e

        # Hosts touched by this push. hosts/<dir> maps to the flake attr
        # name; mcp_vm is the dir for the `mcp` host; rpi* dirs have no
        # simple mapping so they are skipped (rpi4/rpi5 are aarch64).
        # CI_PREV_COMMIT_SHA, not CI_COMMIT_BEFORE: the latter is a Drone name
        # that Woodpecker does not set, so it rendered as before="" on every
        # run, the git diff below was never reached, and this gate silently
        # checked the dns+woodpecker fallback forever instead of the hosts the
        # push touched.
        before="${CI_PREV_COMMIT_SHA:-}"
        sha="${CI_COMMIT_SHA:-HEAD}"
        hosts=""
        # --is-ancestor rather than a bare existence check: CI_PREV_COMMIT_SHA
        # is the previous PIPELINE's commit and may be on an unrelated branch,
        # which would diff across branches and pull in far more hosts than the
        # push touched. Falling back to the dns+woodpecker default is cheaper
        # and more honest than evaluating a bogus host set.
        if [ -n "$before" ] && [ "$before" != "$sha" ] && git merge-base --is-ancestor "$before" "$sha" 2>/dev/null; then
          hosts="$(
            git diff --name-only "$before" "$sha" 2>/dev/null \
              | sed -nE 's#^hosts/([^/]+)/.*#\1#p' \
              | sort -u \
              | grep -v '^rpi' \
              | sed 's/^mcp_vm$/mcp/'
          )"
        fi
        if [ -z "$hosts" ]; then
          echo "==> no host config changed; defaulting to dns + woodpecker"
          hosts="dns woodpecker"
        fi
        echo "==> checking hosts: $hosts"

        for h in $hosts; do
          # A hosts/<dir> can exist while its flake attribute is commented out
          # in flake.nix (k3s-server-1, k3s-agent-1, rpi4-1 today). Building one
          # of those fails with "does not provide attribute", which reads like a
          # broken pipeline rather than the intended "not deployed yet" -- so
          # probe the attrset first. This is a name lookup, not a config
          # evaluation, so it is cheap.
          if [ "$(nix eval --apply "s: s ? \"$h\"" ".#nixosConfigurations" 2>/dev/null)" != "true" ]; then
            echo "==> $h has no flake attribute; skipping"
            continue
          fi
          echo "==> $h"
          nix build --dry-run --no-link ".#nixosConfigurations.$h.config.system.build.toplevel"
        done
